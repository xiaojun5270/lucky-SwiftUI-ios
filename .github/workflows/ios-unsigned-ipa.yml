name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: unsigned-ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          set -euo pipefail
          XCODE_26_PATH="$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' -type d | sort | tail -n 1)"
          if [ -z "$XCODE_26_PATH" ]; then
            echo "Xcode 26 is required for native iOS Liquid Glass."
            exit 1
          fi
          sudo xcode-select -s "$XCODE_26_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Check V2 and V3 API compatibility
        run: |
          bash Tests/LoginCompatibility/run.sh
          bash Tests/DockerAPICompatibility/run.sh
          bash Tests/WebServiceCompatibility/run.sh
          bash Tests/StatusCompatibility/run.sh
          bash Tests/AccountSwitching/run.sh
          python3 Tests/AccountUI/checks.py
          python3 Tests/DashboardLayout/checks.py
          python3 Tests/DockerLayout/checks.py

      - name: Inspect project
        run: |
          set -euo pipefail
          mkdir -p artifacts/diagnostics
          xcodebuild -list -project LuckyGlass.xcodeproj | tee artifacts/diagnostics/xcodebuild-schemes.txt

      - name: Build unsigned app
        run: |
          set -euo pipefail
          BASE_BUILD_NUMBER="$(awk -F '[[:space:]]*=[[:space:]]*' '$1 == "CURRENT_PROJECT_VERSION" { print $2; exit }' Version.xcconfig)"
          if ! [[ "$BASE_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "Version.xcconfig must define a numeric CURRENT_PROJECT_VERSION."
            exit 1
          fi
          CI_BUILD_NUMBER="$((BASE_BUILD_NUMBER + GITHUB_RUN_NUMBER))"
          set +e
          xcodebuild \
            -project LuckyGlass.xcodeproj \
            -scheme LuckyGlass \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath build/DerivedData \
            CURRENT_PROJECT_VERSION="$CI_BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            clean build 2>&1 | tee artifacts/diagnostics/xcodebuild.log
          XCODEBUILD_EXIT="${PIPESTATUS[0]}"
          set -e
          find build/DerivedData -maxdepth 8 -path "*/Build/Products/*" -print > artifacts/diagnostics/build-products.txt || true
          exit "$XCODEBUILD_EXIT"

      - name: Package unsigned IPA
        id: package
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData -path '*/Build/Products/*-iphoneos/*.app' -type d -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "No built .app found."
            exit 1
          fi
          APP_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          APP_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          IPA_NAME="lucky-ios-${APP_VERSION}-build-${APP_BUILD}-unsigned.ipa"
          mkdir -p artifacts/Payload
          cp -R "$APP_PATH" artifacts/Payload/
          (cd artifacts && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA_NAME")
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$APP_BUILD" >> "$GITHUB_OUTPUT"
          echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
          echo "App 版本：${APP_VERSION}（构建 ${APP_BUILD}）" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: lucky-ios-unsigned-ipa-v${{ steps.package.outputs.version }}-build-${{ steps.package.outputs.build }}
          path: artifacts/${{ steps.package.outputs.ipa_name }}
          if-no-files-found: error

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucky-ios-build-diagnostics
          path: artifacts/diagnostics
          if-no-files-found: ignore
